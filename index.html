<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REX Training — Video 1: REX Overview</title>
<style>
  :root{
    --bg:#F5F6FA;
    --card:#FFFFFF;
    --border:#E7E8F0;
    --ink:#15142B;
    --muted:#8A8FA3;
    --purple:#6C4CE0;
    --purple-deep:#5638C4;
    --purple-soft:#F1EDFF;
    --blue:#4C8DF5;
    --red:#F0524B;
    --green:#28C285;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(900px 480px at 12% -12%, rgba(108,76,224,0.10), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }
  .app{ width:100%; max-width:1440px; }

  .eyebrow{
    display:flex; align-items:center; gap:10px;
    font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--purple); margin-bottom:10px; font-weight:600;
  }
  .eyebrow .dot{ width:6px;height:6px;border-radius:50%; background:var(--purple); }

  h1.title{ font-size:34px; margin:0 0 4px 0; color:var(--ink); font-weight:700; letter-spacing:-.2px; }
  .subtitle{ color:var(--muted); font-size:16px; margin-bottom:24px; }

  .meter{ display:flex; align-items:center; gap:16px; margin-bottom:20px; }
  .track{ flex:1 1 auto; height:6px; border-radius:6px; background:var(--border); overflow:hidden; }
  .track-fill{ height:100%; background:linear-gradient(90deg, var(--purple), var(--blue)); border-radius:6px; transition:width .5s cubic-bezier(.65,0,.35,1); width:0%; }
  .step-count{ flex:0 0 auto; font-variant-numeric:tabular-nums; font-size:13px; color:var(--muted); min-width:44px; text-align:right; font-weight:600; }

  .card{
    background:var(--card); border-radius:var(--radius); overflow:hidden;
    box-shadow:0 24px 50px -24px rgba(21,20,43,0.18);
    border:1px solid var(--border);
  }

  .art{
    width:100%; aspect-ratio:16/8; background:#fff;
    position:relative; overflow:hidden; border-bottom:1px solid var(--border);
  }
  .art img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:top left; }

  .cursor{
    position:absolute;
    width:24px; height:24px;
    transform:translate(-4px,-2px);
    transition: left .7s cubic-bezier(.65,0,.35,1), top .7s cubic-bezier(.65,0,.35,1), opacity .3s ease;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,0.35));
    z-index:4;
    pointer-events:none;
  }
  .pulse{
    position:absolute;
    width:14px; height:14px;
    border-radius:50%;
    background:var(--purple);
    opacity:0;
    transform:translate(-50%,-50%) scale(0.4);
    z-index:3;
    pointer-events:none;
    transition: left .7s cubic-bezier(.65,0,.35,1), top .7s cubic-bezier(.65,0,.35,1);
  }
  .pulse.fire{ animation: pulseOut .6s ease-out; }
  @keyframes pulseOut{
    0%{ opacity:.55; transform:translate(-50%,-50%) scale(0.4); }
    100%{ opacity:0; transform:translate(-50%,-50%) scale(3.2); }
  }

  .hbox{
    position:absolute;
    border:2px solid var(--purple);
    background:rgba(108,76,224,0.08);
    border-radius:8px;
    box-shadow:0 0 0 4px rgba(108,76,224,0.06);
    transition:left .5s cubic-bezier(.65,0,.35,1), top .5s cubic-bezier(.65,0,.35,1), width .5s cubic-bezier(.65,0,.35,1), height .5s cubic-bezier(.65,0,.35,1), opacity .3s ease;
    pointer-events:none;
    z-index:2;
    opacity:0;
  }
  .hbox.show{ opacity:1; }

  .body-copy{ padding:24px 26px 26px 26px; }
  .step-label{ display:flex; align-items:baseline; gap:10px; margin-bottom:9px; }
  .step-num{ font-size:13px; color:var(--purple); font-weight:700; }
  .step-name{ font-size:12px; text-transform:uppercase; letter-spacing:.10em; color:var(--muted); font-weight:600; }
  .caption{ font-size:22px; line-height:1.55; color:var(--ink); margin:0; }
  .caption b{ color:var(--purple-deep); background:var(--purple-soft); padding:1px 5px; border-radius:4px; }

  .controls{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-top:1px solid var(--border); background:#FCFCFE; }
  button{ font-family:inherit; font-size:14px; border:none; cursor:pointer; border-radius:9px; padding:10px 18px; transition:transform .15s ease, opacity .15s ease, background .15s ease; }
  button:active{ transform:scale(0.97); }
  button:focus-visible{ outline:2px solid var(--purple); outline-offset:2px; }
  .btn-ghost{ background:transparent; color:var(--ink); opacity:.5; }
  .btn-ghost:hover{ opacity:1; }
  .btn-ghost:disabled{ opacity:.22; cursor:default; }
  .btn-primary{ background:var(--purple); color:#fff; font-weight:600; }
  .btn-primary:hover{ background:var(--purple-deep); }

  .dots{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:260px; }
  .dots span{ width:6px;height:6px;border-radius:50%; background:var(--border); }
  .dots span.active{ background:var(--purple); width:16px; border-radius:4px; }

  .hint{ text-align:center; font-size:12px; color:var(--muted); margin-top:16px; }
  kbd{ background:var(--card); border:1px solid var(--border); border-radius:4px; padding:1px 6px; font-size:11px; }

  @media (max-width:480px){ .caption{font-size:16px;} h1.title{font-size:22px;} }
</style>
</head>

      <div class="hbox" id="hbox"></div>
      <div class="pulse" id="pulse"></div>
      <svg class="cursor" id="cursorIcon" viewBox="0 0 24 24">
        <path d="M4 2 L4 20 L9 15.5 L12.5 22 L15 20.5 L11.5 14 L18 14 Z" fill="#15142B" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>

    <div class="body-copy">
      <div class="step-label">
        <span class="step-num" id="stepNumLabel">Step 1</span>
        <span class="step-name" id="stepNameLabel">What is REX</span>
      </div>
      <p class="caption" id="captionText"></p>
    </div>
    <div class="controls">
      <button class="btn-ghost" id="backBtn">← Back</button>
      <div class="dots" id="dots"></div>
      <button class="btn-primary" id="nextBtn">Next →</button>
    </div>
  </div>

  <div class="hint">Use <kbd>←</kbd> <kbd>→</kbd> or click Back / Next to move through steps</div>
</div>

<script>
const steps = [
  {
    name: "What is REX",
    caption: "REX (RecordsX) is <b>a records management system</b> used to manage, track, and process medical record requests from start to finish."
  },
  {
    name: "Overview",
    caption: "<b>Overview</b> provides a snapshot of the firm's records request pipeline, showing the status and volume of requests, including submitted, completed, awaiting payment, awaiting client action, and overdue requests.",
    box: {x:0, y:13.8, w:8.8, h:3.3},
    cursor: {x:3.9, y:15.5}
  },
  {
    name: "Records Activity",
    caption: "<b>Records Activity</b> takes you to a detailed view that highlights which requests need urgent attention.",
    box: {x:0, y:17.1, w:8.8, h:3.3},
    cursor: {x:3.9, y:18.8}
  },
  {
    name: "Cases",
    caption: "<b>Cases</b> lists every case that's been uploaded, whether by the requestor or by an agent.",
    box: {x:0, y:20.1, w:8.8, h:3.3},
    cursor: {x:3.9, y:21.8}
  },
  {
    name: "Records Pipeline",
    caption: "<b>Records Pipeline</b> gives you a board view of where every request currently sits in the process.",
    box: {x:0, y:24.1, w:8.8, h:3.3},
    cursor: {x:3.9, y:25.7}
  },
  {
    name: "Settings",
    caption: "<b>Settings</b> is where the law firm's account and configuration options live.",
    box: {x:0, y:44.5, w:8.8, h:3.3},
    cursor: {x:3.9, y:46.2}
  }
];

let idx = 0;
const captionText = document.getElementById('captionText');
const stepNumLabel = document.getElementById('stepNumLabel');
const stepNameLabel = document.getElementById('stepNameLabel');
const stepNow = document.getElementById('stepNow');
const stepMax = document.getElementById('stepMax');
const trackFill = document.getElementById('trackFill');
const backBtn = document.getElementById('backBtn');
const nextBtn = document.getElementById('nextBtn');
const dotsHost = document.getElementById('dots');
const cursorIcon = document.getElementById('cursorIcon');
const pulse = document.getElementById('pulse');
const hbox = document.getElementById('hbox');

stepMax.textContent = steps.length;

function buildDots(){
  dotsHost.innerHTML = '';
  steps.forEach((_, i) => {
    const d = document.createElement('span');
    if(i === idx) d.classList.add('active');
    dotsHost.appendChild(d);
  });
}

function moveCursor(target){
  if(!target){
    cursorIcon.style.opacity = '0';
    pulse.classList.remove('fire');
    return;
  }
  cursorIcon.style.opacity = '1';
  cursorIcon.style.left = target.x + '%';
  cursorIcon.style.top = target.y + '%';
  pulse.style.left = target.x + '%';
  pulse.style.top = target.y + '%';
  pulse.classList.remove('fire');
  void pulse.offsetWidth;
  setTimeout(() => pulse.classList.add('fire'), 650);
}

function moveBox(box){
  if(!box){
    hbox.classList.remove('show');
    return;
  }
  hbox.style.left = box.x + '%';
  hbox.style.top = box.y + '%';
  hbox.style.width = box.w + '%';
  hbox.style.height = box.h + '%';
  hbox.classList.add('show');
}

function render(){
  const s = steps[idx];
  captionText.innerHTML = s.caption;
  stepNumLabel.textContent = 'Step ' + (idx+1);
  stepNameLabel.textContent = s.name;
  stepNow.textContent = idx+1;
  trackFill.style.width = ((idx+1)/steps.length*100) + '%';
  backBtn.disabled = idx === 0;
  nextBtn.textContent = idx === steps.length-1 ? 'Done ✓' : 'Next →';
  buildDots();
  moveBox(s.box);
  moveCursor(s.cursor);
}

function go(delta){
  const next = idx + delta;
  if(next < 0 || next > steps.length-1) return;
  idx = next;
  render();
}

backBtn.addEventListener('click', () => go(-1));
nextBtn.addEventListener('click', () => {
  if(idx === steps.length-1){ idx = 0; render(); return; }
  go(1);
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowRight') go(1);
  if(e.key === 'ArrowLeft') go(-1);
});

render();
</script>
